[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-commerce-platform-python"
version = "0.1.0"
description = "Python port of the live-commerce flash-sale backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "asyncmy>=0.2,<1",
  "cryptography>=41,<47",
  "httpx>=0.27,<1",
  "redis>=5,<7",
  "aiokafka>=0.11,<1",
  "rocketmq-python-client>=5.1.2,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
